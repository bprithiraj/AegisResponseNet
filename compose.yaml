services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: aegis
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-aegis-local-only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - aegis-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis -d aegis"]
      interval: 3s
      timeout: 3s
      retries: 20
  app:
    build: .
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/aegis
      DATABASE_USERNAME: aegis
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-aegis-local-only}
      AEGIS_BIND_ADDRESS: 0.0.0.0
      AEGIS_API_KEY: ${AEGIS_API_KEY:?Set AEGIS_API_KEY in .env}
      AEGIS_DEMO_CONTROLS: ${AEGIS_DEMO_CONTROLS:-false}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  aegis-data:
